[tool.poetry]
name = "latent_discrimination"
version = "0.1"
packages = [
    { include = "src" }
]
description = "aa"
authors = [ "Katerina Oikonomou <koikonomou@iit.demokritos.gr>",
	        "Stasinos Konstantopoulos <konstant@iit.demokritos.gr>" ]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
numpy = "^1.26"

#torch = {version = "^2.7.0+cpu", source = "pytorch_cpu"}
#torchvision>=0.16
#torchaudio>=2.1
#diffusers==0.30.2
#transformers>=4.41
#accelerate>=0.33
#huggingface_hub>=0.23
#scikit-learn>=1.3

# Synthetic data
matplotlib = "^3.7"
shapely = "^2.1"
pandas = "^2.3"


[[tool.poetry.source]]
name = "pytorch_cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
